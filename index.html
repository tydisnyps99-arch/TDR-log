<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>システム画面</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }
    .menu {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .menu button {
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    /* 画面切り替え用のスタイル設定 */
    .screen {
      display: none;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .screen.active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- メニューボタン -->
  <div class="menu">
    <button onclick="showScreen('arrival')">現地到着</button>
    <button onclick="showScreen('park')">パーク選択</button>
    <button onclick="showScreen('startup')">立ち上げ</button>
    <button onclick="showScreen('record')">記録画面</button>
    <button onclick="showScreen('admin')">管理者設定</button>
  </div>

  <!-- 各画面コンテンツ -->
  <div id="arrival" class="screen active">
    <h2>現地到着</h2>
    <p>現地到着画面のコンテンツです。</p>
  </div>

  <div id="park" class="screen">
    <h2>パーク選択</h2>
    <p>パーク選択画面のコンテンツです。</p>
  </div>

  <div id="startup" class="screen">
    <h2>立ち上げ</h2>
    <p>立ち上げ画面のコンテンツです。</p>
  </div>

  <div id="record" class="screen">
    <h2>記録画面</h2>
    <!-- 過去にHTMLで作られた記録画面のコードをここに貼り付けます -->
    <p>ここに既存の記録画面の項目が入ります。</p>
  </div>

  <div id="admin" class="screen">
    <h2>管理者設定</h2>
    <p>管理者設定画面のコンテンツです。</p>
  </div>

  <!-- 画面切り替えスクリプト -->
  <script>
    function showScreen(screenId) {
      // 一度すべての画面を非表示にする
      const screens = document.querySelectorAll('.screen');
      screens.forEach(screen => screen.classList.remove('active'));

      // 選択されたIDの画面だけを表示する
      const targetScreen = document.getElementById(screenId);
      if (targetScreen) {
        targetScreen.classList.add('active');
      }
    }
  </script>

</body>
</html>
