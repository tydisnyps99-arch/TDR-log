<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東京ディズニーリゾート 体験ログ</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>✨ 東京ディズニーリゾート<br>体験ログ</h1>
    </header>

    <!-- 1枚目: 基本設定 -->
    <section id="step-1" class="card">
      <div class="form-group">
        <label for="visit-date">日付</label>
        <input type="date" id="visit-date">
      </div>
      <div class="form-group">
        <label for="arrival-time">現地到着時間</label>
        <input type="time" id="arrival-time">
      </div>
      <div class="form-group">
        <label>パーク</label>
        <div class="radio-group">
          <label><input type="radio" name="park" value="tdl" checked> 東京ディズニーランド</label>
          <label><input type="radio" name="park" value="tds"> 東京ディズニーシー</label>
        </div>
      </div>
      <button id="btn-to-step2" class="btn btn-primary">今日のログを開始</button>
      <div class="btn-sub-group">
        <button type="button" class="btn btn-secondary">過去のログを見る</button>
        <button type="button" class="btn btn-secondary">管理者設定</button>
      </div>
    </section>

    <!-- 2枚目: 立ち上げ時間の記録 (初期状態は非表示) -->
    <section id="step-2" class="card hidden">
      <h2>立ち上げ時間の記録</h2>
      <p class="description">「立って待つ状態」になった時間を記録します。</p>
      <div class="form-group">
        <label for="standup-time">立ち上げ時間</label>
        <input type="time" id="standup-time">
      </div>
      <div class="btn-inline-group">
        <button type="button" id="btn-to-step3-record" class="btn btn-action">記録して開始</button>
        <button type="button" id="btn-to-step3-skip" class="btn btn-outline">すでに立って待っています</button>
      </div>
    </section>

    <!-- 3枚目: 体験ログ (初期状態は非表示) -->
    <section id="step-3" class="card hidden">
      <h2>体験ログ</h2>

      <!-- DPA / パス取得記録 -->
      <div class="sub-section">
        <h3>🎫 DPA / パス取得記録</h3>
        <div class="form-group">
          <label for="pass-acquire-time">取得時間</label>
          <input type="time" id="pass-acquire-time">
        </div>
        <div class="form-group">
          <label for="pass-start-time">利用開始時間（5分刻み）</label>
          <input type="time" id="pass-start-time" step="300">
        </div>
        <div class="form-group">
          <label for="pass-facility">対象施設 / ショー</label>
          <select id="pass-facility">
            <option value="">選択してください</option>
            <option value="soarin">ソアリン：ファンタスティック・フライト</option>
            <option value="center">センター・オブ・ジ・アース</option>
            <option value="beauty">美女と野獣“魔法のものがたり”</option>
          </select>
        </div>
        <button type="button" class="btn btn-action">＋ パス取得をログに記録</button>
      </div>

      <hr class="divider">

      <!-- 施設体験ログ -->
      <div class="sub-section">
        <h3>🎡 体験ログを記録</h3>
        <div class="form-group">
          <label for="facility-search">施設・エンターテイメント名（数文字で検索）</label>
          <input type="text" id="facility-search" placeholder="例: ソアリン">
        </div>
        <div class="form-group">
          <label for="queue-time">並び始め時間</label>
          <input type="time" id="queue-time">
        </div>
        <div class="form-group">
          <label for="preshow-time">プレショー部屋入場</label>
          <input type="time" id="preshow-time">
        </div>
        <div class="form-group">
          <label for="ride-time">乗車時間</label>
          <input type="time" id="ride-time">
        </div>
      </div>
    </section>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
